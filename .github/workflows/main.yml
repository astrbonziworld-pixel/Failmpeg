name: Build FFmpeg for iOS 16.0.1

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build FFmpeg for iOS 16.0.1
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install yasm nasm pkg-config

      - name: Install gas-preprocessor
        run: |
          # Download gas-preprocessor.pl directly from libav repository
          sudo curl -L https://raw.githubusercontent.com/libav/gas-preprocessor/master/gas-preprocessor.pl -o /usr/local/bin/gas-preprocessor.pl
          sudo chmod +x /usr/local/bin/gas-preprocessor.pl
          *Verification:* Run `gas-preprocessor.pl --help` to verify it is globally accessible.

      - name: Download and Extract FFmpeg
        env:
          FFMPEG_VERSION: "6.1"
        run: |
          curl -O https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz
          tar -xf ffmpeg-${FFMPEG_VERSION}.tar.xz
          mv ffmpeg-${FFMPEG_VERSION} ffmpeg_src

      - name: Build FFmpeg for iOS Device and Simulator
        run: |
          cd ffmpeg_src
          
          INSTALL_DIR="$(pwd)/../thin_output"
          mkdir -p "$INSTALL_DIR"
          
          ARCHS=("arm64" "x86_64")
          
          for ARCH in "${ARCHS[@]}"; do
            echo "Building for architecture: $ARCH"
            
            if [ "$ARCH" = "x86_64" ]; then
              PLATFORM="iPhoneSimulator"
              DEPLOY_TARGET="16.0.1"
            else
              PLATFORM="iPhoneOS"
              DEPLOY_TARGET="16.0.1"
            fi
            
            mkdir -p "build_$ARCH"
            cd "build_$ARCH"
            
            SDKROOT=$(xcrun -sdk $(echo $PLATFORM | tr '[:upper:]' '[:lower:]') --show-sdk-path)
            
            export CFLAGS="-arch $ARCH -mios-version-min=$DEPLOY_TARGET -isysroot $SDKROOT"
            export LDFLAGS="-arch $ARCH -mios-version-min=$DEPLOY_TARGET -isysroot $SDKROOT"
            
            ../configure \
              --target-os=darwin \
              --arch=$ARCH \
              --cc="$(xcrun -find clang)" \
              --as="gas-preprocessor.pl" \
              --sysroot="$SDKROOT" \
              --enable-cross-compile \
              --disable-programs \
              --disable-doc \
              --enable-pic \
              --prefix="$INSTALL_DIR/$ARCH" \
              || { cat ffbuild/config.log; exit 1; }
              
            make -j$(sysctl -n hw.ncpu) install
            cd ..
          done

      - name: Package Artifacts
        run: |
          cd thin_output
          zip -r ../ffmpeg-ios-16.0.1-libraries.zip .
          cd ..

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-ios-16.0.1-artifacts
          path: ffmpeg-ios-16.0.1-libraries.zip
