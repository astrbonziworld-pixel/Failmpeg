name: Build FFmpeg and iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-all:
    runs-on: macos-15
    env:
      IOS_DEPLOYMENT_TARGET: "16.1.1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          brew install nasm pkg-config automake libtool git

      - name: meh
        run: |
          git clone --depth 1 https://github.com/FFmpeg/FFmpeg.git ffmpeg-source
          cd ffmpeg-source
          
          SDKROOT_IOS=$(xcrun -sdk iphoneos --show-sdk-path)
          PREFIX_DIR="$(pwd)/FFmpeg-iOS-Install"

          ./configure \
            --target-os=darwin \
            --arch=arm64 \
            --enable-cross-compile \
            --disable-shared \
            --enable-static \
            --disable-doc \
            --disable-ffplay \
            --disable-ffprobe \
            --prefix="$PREFIX_DIR/arm64-ios" \
            --extra-cflags="-arch arm64 -mios-version-min=$IOS_DEPLOYMENT_TARGET -isysroot $SDKROOT_IOS" \
            --extra-ldflags="-arch arm64 -mios-version-min=$IOS_DEPLOYMENT_TARGET -isysroot $SDKROOT_IOS"

          make -j$(sysctl -n hw.ncpu)
          make install
          cd ..

      - name: Set up Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app

      - name: Build and Archive App
        run: |
          xcodebuild -project Failmpeg.xcodeproj \
                     -scheme Failmpeg \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath build/Failmpeg.xcarchive \
                     archive \
                     CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOW_SIMULATOR_ONLY=YES

      - name: Export to IPA
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
                     -archivePath build/Failmpeg.xcarchive \
                     -exportPath build/ipa-output \
                     -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: build/ipa-output/*.ipa
